<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Contacto - E-TECH MÉXICO</title>
</head>

<body>
    <!-- Barra de Navegación -->
    <nav class="navbar py-2 px-5 d-flex justify-content-between">
        <div class="d-flex align-items-center">
            <a href="index.html" style="text-decoration: none;">
                <h1 class="text-logo" style="font-size: 2.5em; font-weight: bold;">
                    E-TECH MÉXICO
                </h1>
            </a>
            <a href="index.html"><img src="./assets/images/logo_e_tech_transparente.png" alt="logo tech"
                    style="height: 100px; width: auto;"></a>
        </div>

        <div class="d-flex gap-3 justify-content-center align-items-center">
            <a class="btn btn-primary" href="index.html" role="button">Inicio</a>
            <a class="btn btn-primary" href="index.html" role="button">Nosotros</a>
            <a class="btn btn-primary" href="contacto.html" role="button">Contacto</a>
            <a class="btn btn-primary" href="#" role="button">Catálogo</a>
            <a class="btn btn-primary" href="#" role="button">Login</a>
        </div>
    </nav>

    <!-- Contenido Principal: Formulario de Contacto -->
    <main class="container my-5">
        <section class="row justify-content-center contact-section">
            <div class="col-md-8 col-lg-6">
                
                <header class="text-center mb-4">
                    <h2 class="section-title fw-bold" style="color: var(--color-azul-oscuro);">Establecer Comunicación</h2>
                </header>
                
                <!-- Contenedor para la alerta -->
                <div id="formAlert" class="alert-message mb-3"></div>

                <!-- Formulario -->
                <form id="contactForm" class="contact-form card p-4 shadow bg-opacity-50">
                    
                    <div class="form-group mb-3">
                        <label for="nombre" class="form-label fw-bold">Nombre Completo</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej. Kevin Salgado" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="correo" class="form-label fw-bold">Correo Electrónico</label>
                        <input type="email" id="correo" class="form-control" placeholder="kevin@ejemplo.com" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="telefono" class="form-label fw-bold">Teléfono (10 dígitos)</label>
                        <input type="tel" id="telefono" class="form-control" placeholder="5512345678" required>
                    </div>

                    <div class="form-group mb-3">
                        <label for="mensaje" class="form-label fw-bold">Mensaje</label>
                        <textarea id="mensaje" class="form-control" rows="5" placeholder="Escribe tu consulta aquí..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fs-5 fw-bold mt-2">Enviar Mensaje</button>
                    
                </form>

            </div>
        </section>
    </main>

    <!-- Pie de Página -->
    <footer>
        <h6 class="text-center m-0 p-2">
            © 2026 E-TECH MÉXICO - Todos los derechos reservados.
        </h6>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./js/contacto.js"></script>
</body>

</html>
