<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">

    <link rel="icon" type="image/x-icon" href="/assets/images/logo_e_tech_transparente.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@100..900&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css" rel="stylesheet">

    <title>Iniciar Sesión | E-TECH MÉXICO</title>
</head>

<body>

    <nav></nav>

    <main class="p-4">
        <section class="row justify-content-center">

            <header class="text-center m-4">
                <h2 class="fw-bold" style="color: var(--color-azul-oscuro);">
                    Iniciar Sesión
                </h2>

                <p class="text-muted">
                    Ingresa tus credenciales para acceder al sistema.
                </p>
            </header>

            <div class="container">
                <div class="row justify-content-center">

                    <div class="col-12 col-lg-6 col-md-8 col-sm-10">

                        <form id="loginForm" class="card card-formulario p-4 shadow" autocomplete="off" novalidate>

                            <!-- Correo Electrónico -->
                            <div class="form-group mb-3 position-relative">
                                <label for="email" class="form-label fw-bold">
                                    Correo Electrónico
                                </label>

                                <input type="email" id="email" name="email" class="form-control"
                                    placeholder="ejemplo@correo.com" required>

                                <div class="invalid-feedback">
                                    Campo obligatorio
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="form-group mb-3 position-relative">
                                <label for="password" class="form-label fw-bold">
                                    Contraseña
                                </label>

                                <input type="password" id="password" name="password" class="form-control"
                                    placeholder="********" required>

                                <div class="invalid-feedback">
                                    Campo obligatorio
                                </div>
                            </div>

                            <div class="mb-3 text-center">
                                <a href="./recuperar-password.html" class="text-decoration-none fw-semibold"
                                    style="color: #303a49;">
                                    ¿Olvidaste tu contraseña?
                                </a>

                            </div>
                            <div id="formAlerta" class="mb-3"></div>

                            <!-- Botones -->
                            <div class="d-flex gap-2 mb-3">

                                <button type="reset" class="btn btn-outline-secondary w-50 fw-bold">
                                    Limpiar
                                </button>

                                <button type="submit" class="btn btn-primary w-50 fw-bold">
                                    Ingresar
                                </button>
                            </div>

                            <div class="mb-3 text-center">
                                <span>
                                    ¿No tienes una cuenta? <br>
                                    <a href="./registro-usuario.html" class="text-decoration-none fw-semibold" style="color: #303a49;">
                                        ¡Registrate ahora!
                                    </a>
                                </span>
                            </div>

                        </form>

                    </div>

                </div>
            </div>

        </section>
    </main>

    <footer>

    </footer>

    <script src="./js/main.js" type="module"></script>
    <script src="./js/login-validacion.js" type="module"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
